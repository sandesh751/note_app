name: deploy-docker

on:
 push:
   branches:
     - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
     - name: checkout
       uses: actions/checkout@v1
     - name: ssh to login
       uses: appleboy/ssh-action@v1.0.3
       with:
         host: ${{ secrets.HOST }}
         username: ${{ secrets.SSH_USERNAME }}
         key: ${{ secrets.KEY }}
         script: |
           cd /root/github
           git pull origin main
           docker compose up -d --build
         
